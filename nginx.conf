map $uri $nodens_cache_control {
  default "public, max-age=0, must-revalidate";
  ~^/_astro/ "public, max-age=31536000, immutable";
  ~*\.(?:css|js|svg|jpg|jpeg|png|webp|avif|woff2)$ "public, max-age=86400";
  ~^/healthz$ "no-store";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Cache-Control $nodens_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
