name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing of the provenance attestation
  attestations: write

concurrency:
  group: nodens-production
  cancel-in-progress: false

jobs:
  publish:
    # Only same-repo pushes to main; a fork PR whose branch is named main also matches `branches`.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build once into the local store; the image scanned and smoke-tested below is the one pushed.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ghcr.io/pxm-0/nodens:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/pxm-0/nodens:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: Smoke-test the candidate image
        run: scripts/container-smoke.sh "ghcr.io/pxm-0/nodens:${SHA}"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the scanned image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker push --quiet "ghcr.io/pxm-0/nodens:${SHA}"
          ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "ghcr.io/pxm-0/nodens:${SHA}" | grep '^ghcr.io/pxm-0/nodens@sha256:' | head -n 1)"
          test -n "$ref"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pxm-0/nodens
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Published image"
            echo
            echo "- Image: \`ghcr.io/pxm-0/nodens@${DIGEST}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Tags: \`ghcr.io/pxm-0/nodens:${SHA}\`"
            echo "- Scanned (Trivy HIGH/CRITICAL) and smoke-tested before push; provenance attested"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=ghcr.io/pxm-0/nodens@${DIGEST}"
