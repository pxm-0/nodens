name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: nodens-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          tags: ghcr.io/pxm-0/nodens:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Published image"
            echo
            echo "- Image: \`ghcr.io/pxm-0/nodens@${DIGEST}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Tags: \`ghcr.io/pxm-0/nodens:${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=ghcr.io/pxm-0/nodens@${DIGEST}"
